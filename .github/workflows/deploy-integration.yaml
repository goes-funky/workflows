        uses: actions/download-artifact@v4
        with:
          name: build-ref
      - name: Setup Kubernetes tools
        uses: yokawasa/action-setup-kube-tools@v0.11.1
        with:
          setup-tools: skaffold
          skaffold: ${{ inputs.skaffold }}
