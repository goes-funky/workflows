name: Flux Skaffold Build
"on":
  workflow_call:
    inputs:
      skaffold-file:
        type: string
        description: Skaffold file to use
        default: skaffold.yaml
      skip-checkout:
        type: boolean
        description: Whether to skip checkout
        default: false
      skaffold:
        type: string
        description: Skaffold version
        default: 1.39.2
      is-repo-public:
        type: boolean
        description: Whether to skip ssh agent configuration
        default: false
      docker-file:
        type: string
        description: Docker file to use
        default: Dockerfile
      with-submodules:
        type: boolean
        description: Whether to fetch git submodules
        default: false
    secrets:
      ssh-private-key:
        description: SSH private key used to authenticate to GitHub with, in order to fetch private dependencies
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    name: Reuse existing modeling-api smoke image
    outputs:
      image: 119462788859.dkr.ecr.eu-central-1.amazonaws.com/modeling-api:7ee2e81-202609232217-test-modeling-aws-build@sha256:9e3b86e73ab7cf60a8e8aeb0f12f4ce50f779946ffcc4e0c7ad037eba524e013
      registry: 119462788859.dkr.ecr.eu-central-1.amazonaws.com
    timeout-minutes: 15
    steps:
      - run: echo 'Reusing existing image; no build or image push'
  notify-infra:
    uses: ./.github/workflows/notify-infra.yaml
    needs:
      - build
    if: github.event_name == 'push' && github.ref == 'refs/heads/aliaksei/test-infra-dispatch'
    with:
      image: ${{ needs.build.outputs.image }}
      registry: ${{ needs.build.outputs.registry }}
